name: Rebase Dependabot PRs

# Keeps Dependabot PRs freshly rebased whenever main moves, so our
# rebase-based auto-merge isn't blocked by a stale branch. Dependabot's own
# `rebase-strategy: auto` rebases on its schedule; this closes the gap by
# forcing an immediate rebase on every push to main.
on:
  push:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Rebase open Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pr in $(gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("dependabot/")) | .number'); do
            gh pr comment "$pr" --body '@dependabot rebase'
          done
